# MOKO OS live image: keep udev coldplug from probing hardware this OS can
# never drive. With MODULES=most the initramfs carries 892 modules and each is
# a candidate modalias probe. None of the drivers below exist in a laptop.
#
# HONEST STATUS: this is hygiene, NOT a measured boot-time win. An earlier
# revision of this header claimed it saved boot time; moko-boot-diag6 A/B'd it
# against the unmodified release ISO and the claim did not survive. The
# blacklist demonstrably took effect -- parport_pc/ppdev loaded-module
# counts went 1/1 -> 0/0 -- and the boot still got SLOWER on every marker:
#   plymouth-quit    107.31s -> 135.36s
#   Startup finished 131.33s -> 159.97s
#   shell-ready      156.85s -> 194.17s
# That is not a regression caused by the file (no failed units, udevadm settle
# rc=0, /dev/dri ACLs intact, MOKO_HEALTH result=pass); it is QEMU/TCG
# run-to-run variance, which is +-15-30s and therefore larger than any effect
# this file could plausibly have. Conclusion: keep it because probing a
# Fibre-Channel HBA on a MacBook is pointless, and do not credit it with
# seconds. Only within-run attribution is trustworthy on this harness --
# per-component live-config timestamps and `systemctl show` monotonic deltas.
#
# This file only blocks alias-based autoload (the way udev loads drivers).
# An explicit `modprobe <name>` still works, so nothing is made unusable.
# kvm_amd / kvm_intel were in an earlier revision of this file and have been
# removed. They bought nothing measurable (see the honest status above) while
# genuinely disabling nested virtualisation in the shipped image, which is a
# capability loss rather than hygiene. If they are ever re-added, justify them
# with a measurement, not with an assumption that "VMs are not needed here".
#
# Test: boot the ISO, then `lsmod | grep -cE 'parport_pc|ppdev'` should print 0,
#   `modprobe kvm_intel` must still succeed (this file only blocks autoload), and
#   `ls -l /dev/dri/` must still show the `+` ACL marker on card0 and renderD128
#   (that `+` is what lets uid 1000 render).
# Rollback: delete this file and rebuild the image.

# --- Data-centre Ethernet / SmartNIC / Fibre-Channel HBAs ---
blacklist mlx4_core
blacklist mlx5_core
blacklist mlx5_ib
blacklist bnx2
blacklist bnx2x
blacklist qed
blacklist qede
blacklist cxgb3
blacklist cxgb4
blacklist nfp
blacklist liquidio
blacklist netxen_nic
blacklist qlcnic
blacklist sfc
blacklist lpfc
blacklist qla2xxx
blacklist bfa
blacklist myri10ge
blacklist be2net
blacklist enic
blacklist hinic

# --- Legacy parallel port / line printer ---
blacklist parport_pc
blacklist ppdev
blacklist lp

